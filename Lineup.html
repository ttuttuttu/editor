<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캐릭터 라인업 에디터</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16181f;
    --paper:#f4f4f1;
    --line:#dcdcd6;
    --accent:#2f7a6f;
    --accent-soft:#e4efec;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--paper);
    font-family:'Gowun Dodum',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  header{
    background:var(--ink);
    color:#f5f4ef;
    padding:20px 26px 18px;
    letter-spacing:.04em;
  }
  header h1{
    font-family:'Gowun Batang',serif;
    font-size:19px;
    font-weight:700;
  }
  header p{
    font-size:12px;
    opacity:.62;
    margin-top:5px;
  }
  main{
    max-width:1120px;
    margin:0 auto;
    padding:22px 18px 60px;
  }
  .stage{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    box-shadow:0 8px 26px rgba(22,24,31,.06);
  }
  canvas#view{
    width:100%;
    display:block;
    border-radius:8px;
    touch-action:none;
    cursor:grab;
  }
  .hint-line{
    font-size:12px;
    color:#8a8a83;
    margin:10px 4px 0;
    line-height:1.7;
  }
  .controls{
    margin-top:18px;
    display:grid;
    gap:14px;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
  }
  .card h2{
    font-size:13px;
    font-weight:400;
    color:#6d6d66;
    letter-spacing:.08em;
    margin-bottom:12px;
  }
  .card h2 b{color:var(--accent);font-weight:400;}
  .row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:9px;
  }
  .row + .row{margin-top:11px;}
  button.pill{
    font-family:inherit;
    font-size:13px;
    padding:8px 17px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  button.pill:hover{border-color:var(--accent);background:var(--accent-soft);}
  button.pill.primary{
    background:var(--ink);
    color:#f5f4ef;
    border-color:var(--ink);
  }
  button.pill.primary:hover{background:#2a2d38;}
  button.pill:disabled{opacity:.4;cursor:default;}
  label.inline{
    font-size:13px;
    color:#55554f;
    display:flex;
    align-items:center;
    gap:8px;
  }
  input[type=range]{width:150px;accent-color:var(--accent);}
  input[type=color]{
    width:34px;height:30px;border:1px solid var(--line);
    border-radius:8px;background:#fff;padding:2px;cursor:pointer;
  }
  input[type=number]{
    font-family:inherit;font-size:13px;width:62px;
    padding:6px 8px;border:1px solid var(--line);border-radius:8px;
  }
  input[type=text]{
    font-family:inherit;font-size:13px;
    padding:8px 12px;border:1px solid var(--line);border-radius:10px;
    background:#fff;color:var(--ink);
  }
  input[type=text]:focus{outline:1.5px solid var(--accent);}
  input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;}
  input.hex{
    width:96px;
    font-family:'Courier New',monospace;
    letter-spacing:.04em;
  }
  input.hex.bad{outline:1.5px solid #c0564f;}
  .seg{
    display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;
  }
  .seg button{
    font-family:inherit;font-size:13px;padding:8px 15px;border:none;background:#fff;cursor:pointer;color:#77776f;
  }
  .seg button.on{background:var(--accent);color:#fff;}
  #gifStatus{
    font-size:12px;color:var(--accent);min-width:90px;
  }
  .name-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:9px;
  }
  .name-grid label{
    font-size:12px;color:#9a9a92;display:flex;flex-direction:column;gap:5px;
  }
  footer{
    text-align:center;font-size:11px;color:#a5a59d;padding:8px 0 26px;letter-spacing:.1em;
  }
  @media (max-width:560px){
    input[type=range]{width:110px;}
  }
</style>
</head>
<body>

<header>
  <h1>⊹ 캐릭터 라인업 에디터</h1>
  <p>사선 스트립에 캐릭터 외관 + 이름 정리 &nbsp;✦&nbsp; 1번 칸부터 이름과 함께 순차 슬라이드 인 &nbsp;·&nbsp; GIF · PNG · JPG 저장</p>
</header>

<main>
  <div class="stage">
    <canvas id="view" width="1600" height="900"></canvas>
    <p class="hint-line">칸을 클릭해 선택 → 드래그로 위치 이동, 휠(또는 크기 슬라이더)로 확대·축소 · 사진 파일을 칸 위로 끌어다 놓아도 됩니다 · 칸 수를 바꿔도 넣어 둔 사진과 이름은 유지돼요</p>
  </div>

  <div class="controls">

    <div class="card">
      <h2>선택된 칸 &nbsp;—&nbsp; <b id="selName">없음</b></h2>
      <div class="row">
        <button class="pill primary" id="btnUpload">사진 넣기 / 바꾸기</button>
        <button class="pill" id="btnFlipH">좌우 반전</button>
        <button class="pill" id="btnFlipV">상하 반전</button>
        <button class="pill" id="btnReset">위치·크기 초기화</button>
        <button class="pill" id="btnClear">사진 지우기</button>
      </div>
      <div class="row">
        <label class="inline">크기
          <input type="range" id="scale" min="0.3" max="4" step="0.01" value="1">
        </label>
      </div>
    </div>

    <div class="card">
      <h2>구성</h2>
      <div class="row">
        <label class="inline">칸 수
          <span class="seg" id="countSeg">
            <button data-v="2">2</button>
            <button data-v="3">3</button>
            <button data-v="4" class="on">4</button>
            <button data-v="5">5</button>
            <button data-v="6">6</button>
          </span>
        </label>
        <label class="inline">사선 기울기
          <input type="range" id="slant" min="0" max="130" step="1" value="60">
        </label>
        <label class="inline">칸 간격
          <input type="range" id="gap" min="8" max="60" step="1" value="24">
        </label>
        <label class="inline">배경색
          <input type="color" id="bgColor" value="#ffffff">
        </label>
      </div>
    </div>

    <div class="card">
      <h2>이름 &nbsp;·&nbsp; 각 칸과 함께 슬라이드되어 등장</h2>
      <div class="name-grid" id="nameGrid"></div>
      <div class="row" style="margin-top:12px">
        <label class="inline">위치
          <span class="seg" id="namePosSeg">
            <button data-v="bottom" class="on">하단</button>
            <button data-v="top">상단</button>
          </span>
        </label>
        <label class="inline">색
          <input type="color" id="nameColor" value="#ffffff">
          <input type="text" id="nameColorHex" class="hex" value="#ffffff" maxlength="7" spellcheck="false">
        </label>
        <label class="inline">크기
          <input type="range" id="nameSize" min="22" max="90" step="1" value="44">
        </label>
        <label class="inline"><input type="checkbox" id="nameShadow" checked> 그림자</label>
        <label class="inline"><input type="checkbox" id="nameBar" checked> 포인트 바</label>
      </div>
    </div>

    <div class="card">
      <h2>애니메이션 &nbsp;·&nbsp; 저장</h2>
      <div class="row">
        <button class="pill primary" id="btnPlay">▶ 재생</button>
        <label class="inline">슬라이드(초)
          <input type="number" id="dur" min="0.5" max="4" step="0.1" value="1.5">
        </label>
        <label class="inline">GIF 크기
          <span class="seg" id="gifSizeSeg">
            <button data-v="0.35">소</button>
            <button data-v="0.5" class="on">중</button>
            <button data-v="0.75">대</button>
          </span>
        </label>
      </div>
      <div class="row">
        <button class="pill" id="btnPng">PNG 저장</button>
        <button class="pill" id="btnJpg">JPG 저장</button>
        <button class="pill" id="btnGif">GIF 저장</button>
        <span id="gifStatus"></span>
      </div>
    </div>

  </div>
</main>

<footer>✦ &nbsp; 1600 × 900 &nbsp; ✦</footer>

<input type="file" id="file" accept="image/*" hidden>

<script>
/* ───────── 기본 설정 ───────── */
const W = 1600, H = 900;
const m = 40;                 // 바깥 여백
const MAXN = 6;
const $ = id=>document.getElementById(id);

const state = {
  sel:-1,
  n:4,                        // 칸 수
  s:60,                       // 사선 기울기
  g:24,                       // 칸 간격
  bg:'#ffffff',
  dur:1.5,
  gifScale:0.5,
  playing:false,
  name:{ pos:'bottom', color:'#ffffff', size:44, shadow:true, bar:true },
};

/* 슬롯: 칸 수가 바뀌어도 사진·이름 유지되도록 MAXN개 상시 보관 */
const slots = Array.from({ length:MAXN }, (_, i)=>({
  img:null, ox:0, oy:0, scale:1, fx:false, fy:false, name:'',
}));

/* ───────── 지오메트리 ─────────
   바깥 테두리는 수직, 안쪽 경계선만 사선(상단 +s / 하단 −s).
   모든 칸의 가로 폭이 같아 면적 동일. */
let panels = [];
function buildGeometry(){
  const n = state.n, s = state.s, g = state.g;
  const Wi = W - 2 * m;
  const bx = k=>m + k * (Wi / n);        // k번째 경계선의 중앙 x
  panels = [];
  for (let i = 0; i < n; i++){
    const xTL = i === 0     ? m     : bx(i)   + s + g / 2;
    const xTR = i === n - 1 ? W - m : bx(i+1) + s - g / 2;
    const xBL = i === 0     ? m     : bx(i)   - s + g / 2;
    const xBR = i === n - 1 ? W - m : bx(i+1) - s - g / 2;
    const poly = [[xTL, m], [xTR, m], [xBR, H - m], [xBL, H - m]];
    const xs = poly.map(q=>q[0]), ys = poly.map(q=>q[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    /* 등장 방향: 사선 벡터를 따라, 짝수 칸은 위에서 아래로 / 홀수 칸은 아래에서 위로 */
    const dl = Math.hypot(-2 * s, H - 2 * m) || 1;
    const dir = [(-2 * s) / dl, (H - 2 * m) / dl];
    const travel = (H / Math.abs(dir[1] || 1)) * 1.06;
    const sign = i % 2 === 0 ? -1 : 1;
    panels.push({
      poly,
      bb:{ x:x0, y:m, w:x1 - x0, h:H - 2 * m, cx:(x0 + x1) / 2, cy:H / 2 },
      cxTop:(xTL + xTR) / 2,
      cxBot:(xBL + xBR) / 2,
      from:[dir[0] * travel * sign, dir[1] * travel * sign],
      delay: n > 1 ? i * (0.42 / (n - 1)) : 0,
    });
  }
}
buildGeometry();

/* ───────── 렌더 유틸 ───────── */
const view = $('view');
const vctx = view.getContext('2d');

function clamp01(v){ return Math.min(1, Math.max(0, v)); }
function ease(t){ return 1 - Math.pow(1 - t, 3); }
function sub(t, a, b){ return ease(clamp01((t - a) / (b - a))); }
function panelProg(p, t){ return ease(clamp01((t - p.delay) / 0.56)); }
function pathPoly(ctx, poly){
  ctx.beginPath();
  ctx.moveTo(poly[0][0], poly[0][1]);
  for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
  ctx.closePath();
}
/* 스트립 중심선 위 y좌표에서의 x (사선을 따라 이름을 칸 가운데에 놓기 위함) */
function centerlineX(p, y){
  const r = (H - m - y) / (H - 2 * m);   // 하단 0 → 상단 1
  return p.cxBot + (p.cxTop - p.cxBot) * r;
}

/* ───────── 메인 렌더 ─────────
   pT: 슬라이드 진행도. 이름은 각 칸과 함께 올라옴 */
function render(ctx, pT, opts = {}){
  const sc = opts.scale || 1;
  ctx.save();
  ctx.setTransform(sc, 0, 0, sc, 0, 0);
  ctx.fillStyle = state.bg;
  ctx.fillRect(0, 0, W, H);

  /* 1. 스트립 */
  panels.forEach((p, i)=>{
    const sl = slots[i];
    const pr = panelProg(p, pT);
    ctx.save();
    ctx.translate(p.from[0] * (1 - pr), p.from[1] * (1 - pr));
    pathPoly(ctx, p.poly);
    ctx.clip();
    ctx.fillStyle = sl.img ? '#ffffff' : '#efefec';
    ctx.fillRect(p.bb.x, p.bb.y, p.bb.w, p.bb.h);
    if (sl.img){
      const base = Math.max(p.bb.w / sl.img.width, p.bb.h / sl.img.height);
      const k = base * sl.scale;
      ctx.translate(p.bb.cx + sl.ox, p.bb.cy + sl.oy);
      ctx.scale(sl.fx ? -k : k, sl.fy ? -k : k);
      ctx.drawImage(sl.img, -sl.img.width / 2, -sl.img.height / 2);
    } else if (opts.edit){
      ctx.fillStyle = '#b3b3ab';
      ctx.textAlign = 'center';
      ctx.font = '26px "Gowun Dodum", sans-serif';
      ctx.fillText('⊹', p.bb.cx, p.bb.cy - 12);
      ctx.font = '19px "Gowun Dodum", sans-serif';
      ctx.fillText('클릭 후 사진 넣기', p.bb.cx, p.bb.cy + 24);
    }
    ctx.restore();
  });

  /* 2. 이름 — 각 칸과 같은 오프셋으로 함께 슬라이드 */
  const nm = state.name;
  panels.forEach((p, i)=>{
    const sl = slots[i];
    if (!sl.name) return;
    const pr = panelProg(p, pT);
    ctx.save();
    ctx.translate(p.from[0] * (1 - pr), p.from[1] * (1 - pr));
    const bottom = nm.pos === 'bottom';
    const y = bottom ? H - m - 44 - nm.size / 2 : m + 44 + nm.size / 2;
    const x = centerlineX(p, y);
    ctx.font = '700 ' + nm.size + 'px "Gowun Batang", serif';
    ctx.fillStyle = nm.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (nm.shadow){ ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 12; }
    ctx.fillText(sl.name, x, y);
    if (nm.bar){
      ctx.shadowBlur = nm.shadow ? 8 : 0;
      const bw = Math.min(ctx.measureText(sl.name).width, p.bb.w * 0.7);
      ctx.fillRect(x - bw / 2, y + nm.size * 0.72, bw, 4);
    }
    ctx.restore();
  });

  /* 3. 선택 표시 (편집 화면에서만) */
  if (opts.edit && state.sel >= 0 && state.sel < state.n){
    ctx.save();
    ctx.lineWidth = 5;
    ctx.setLineDash([16, 12]);
    ctx.strokeStyle = '#2f7a6f';
    pathPoly(ctx, panels[state.sel].poly);
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function draw(){ render(vctx, 1, { edit:!state.playing }); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

/* ───────── 선택 · 드래그 · 확대 ───────── */
function toCanvas(e){
  const r = view.getBoundingClientRect();
  return [ (e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height ];
}
function inPoly(pt, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > pt[1]) !== (yj > pt[1]) &&
        pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function panelAt(pt){
  for (let i = 0; i < state.n; i++) if (inPoly(pt, panels[i].poly)) return i;
  return -1;
}

let drag = null;
view.addEventListener('pointerdown', e=>{
  if (state.playing) return;
  const pt = toCanvas(e);
  const idx = panelAt(pt);
  if (idx >= 0){
    selectPanel(idx);
    const sl = slots[idx];
    if (sl.img){
      drag = { idx, sx:pt[0], sy:pt[1], ox:sl.ox, oy:sl.oy };
      view.setPointerCapture(e.pointerId);
      view.style.cursor = 'grabbing';
    }
  }
  draw();
});
view.addEventListener('pointermove', e=>{
  if (!drag) return;
  const pt = toCanvas(e);
  const sl = slots[drag.idx];
  sl.ox = drag.ox + (pt[0] - drag.sx);
  sl.oy = drag.oy + (pt[1] - drag.sy);
  draw();
});
['pointerup','pointercancel'].forEach(ev=>view.addEventListener(ev, ()=>{
  drag = null; view.style.cursor = 'grab';
}));
view.addEventListener('wheel', e=>{
  if (state.sel < 0) return;
  const sl = slots[state.sel];
  if (!sl.img) return;
  e.preventDefault();
  sl.scale = Math.min(4, Math.max(0.3, sl.scale * (e.deltaY < 0 ? 1.06 : 0.94)));
  scaleSlider.value = sl.scale;
  draw();
}, { passive:false });

view.addEventListener('dragover', e=>e.preventDefault());
view.addEventListener('drop', e=>{
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f || !f.type.startsWith('image/')) return;
  const idx = panelAt(toCanvas(e));
  if (idx >= 0){ selectPanel(idx); loadImageTo(idx, f); }
});

/* ───────── 컨트롤 ───────── */
const selName = $('selName');
const scaleSlider = $('scale');
const fileInput = $('file');
let pendingUpload = null;

function selectPanel(i){
  state.sel = i;
  selName.textContent = (i + 1) + '번 칸';
  scaleSlider.value = slots[i].scale;
}
function loadImageTo(idx, file){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>{
    const sl = slots[idx];
    sl.img = img; sl.ox = 0; sl.oy = 0; sl.scale = 1; sl.fx = false; sl.fy = false;
    scaleSlider.value = 1;
    draw();
  };
  img.src = url;
}

$('btnUpload').onclick = ()=>{
  if (state.sel < 0){ selectPanel(0); draw(); }
  pendingUpload = state.sel;
  fileInput.click();
};
fileInput.onchange = ()=>{
  if (fileInput.files[0] && pendingUpload !== null) loadImageTo(pendingUpload, fileInput.files[0]);
  fileInput.value = ''; pendingUpload = null;
};
scaleSlider.oninput = ()=>{
  if (state.sel >= 0){ slots[state.sel].scale = parseFloat(scaleSlider.value); draw(); }
};
$('btnFlipH').onclick = ()=>{
  if (state.sel >= 0 && slots[state.sel].img){ slots[state.sel].fx = !slots[state.sel].fx; draw(); }
};
$('btnFlipV').onclick = ()=>{
  if (state.sel >= 0 && slots[state.sel].img){ slots[state.sel].fy = !slots[state.sel].fy; draw(); }
};
$('btnReset').onclick = ()=>{
  if (state.sel < 0) return;
  const sl = slots[state.sel];
  sl.ox = 0; sl.oy = 0; sl.scale = 1; sl.fx = false; sl.fy = false;
  scaleSlider.value = 1; draw();
};
$('btnClear').onclick = ()=>{
  if (state.sel < 0) return;
  slots[state.sel].img = null; draw();
};

/* 구성 */
$('countSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  state.n = +b.dataset.v;
  document.querySelectorAll('#countSeg button').forEach(x=>x.classList.toggle('on', x === b));
  if (state.sel >= state.n) state.sel = -1, selName.textContent = '없음';
  buildGeometry();
  buildNameInputs();
  draw();
});
$('slant').oninput = e=>{ state.s = +e.target.value; buildGeometry(); draw(); };
$('gap').oninput   = e=>{ state.g = +e.target.value; buildGeometry(); draw(); };
$('bgColor').oninput = e=>{ state.bg = e.target.value; draw(); };

/* 이름 입력칸 — 칸 수에 맞춰 동적 생성, 값은 슬롯에 보존 */
function buildNameInputs(){
  const grid = $('nameGrid');
  grid.innerHTML = '';
  for (let i = 0; i < state.n; i++){
    const label = document.createElement('label');
    label.textContent = (i + 1) + '번 칸 이름';
    const input = document.createElement('input');
    input.type = 'text';
    input.maxLength = 20;
    input.placeholder = '이름';
    input.value = slots[i].name;
    input.oninput = ()=>{ slots[i].name = input.value; draw(); };
    label.appendChild(input);
    grid.appendChild(label);
  }
}
buildNameInputs();

$('namePosSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  state.name.pos = b.dataset.v;
  document.querySelectorAll('#namePosSeg button').forEach(x=>x.classList.toggle('on', x === b));
  draw();
});
$('nameSize').oninput    = e=>{ state.name.size = +e.target.value; draw(); };
$('nameShadow').onchange = e=>{ state.name.shadow = e.target.checked; draw(); };
$('nameBar').onchange    = e=>{ state.name.bar = e.target.checked; draw(); };

/* 컬러 피커 ↔ 헥스코드 양방향 동기화 */
function normalizeHex(v){
  v = v.trim();
  if (!v.startsWith('#')) v = '#' + v;
  if (/^#[0-9a-fA-F]{3}$/.test(v)) v = '#' + [...v.slice(1)].map(ch=>ch+ch).join('');
  return /^#[0-9a-fA-F]{6}$/.test(v) ? v.toLowerCase() : null;
}
function bindColorPair(pickerId, hexId, apply){
  const picker = $(pickerId), hex = $(hexId);
  picker.oninput = e=>{
    apply(e.target.value);
    hex.value = e.target.value;
    hex.classList.remove('bad');
    draw();
  };
  hex.oninput = e=>{
    const v = normalizeHex(e.target.value);
    if (v){
      apply(v);
      picker.value = v;
      hex.classList.remove('bad');
      draw();
    } else {
      hex.classList.add('bad');
    }
  };
  hex.onblur = ()=>{
    const v = normalizeHex(hex.value);
    hex.value = v || picker.value;
    hex.classList.remove('bad');
  };
}
bindColorPair('nameColor', 'nameColorHex', v=>state.name.color = v);

$('dur').onchange = e=>{
  state.dur = Math.min(4, Math.max(0.5, parseFloat(e.target.value) || 1.5));
  e.target.value = state.dur;
};
$('gifSizeSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  state.gifScale = parseFloat(b.dataset.v);
  document.querySelectorAll('#gifSizeSeg button').forEach(x=>x.classList.toggle('on', x === b));
});

/* ───────── 타임라인: 슬라이드만 (이름은 칸과 함께) ───────── */
function totalSec(){ return state.dur; }

$('btnPlay').onclick = ()=>{
  if (state.playing) return;
  state.playing = true;
  const t0 = performance.now();
  (function step(now){
    const el = (now - t0) / 1000;
    render(vctx, clamp01(el / state.dur), { edit:false });
    if (el < totalSec()) requestAnimationFrame(step);
    else { state.playing = false; draw(); }
  })(t0);
};

/* ───────── 저장 ───────── */
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function exportStill(type){
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  render(c.getContext('2d'), 1, {});
  c.toBlob(b=>download(b, 'lineup.' + type), type === 'jpg' ? 'image/jpeg' : 'image/png', 0.92);
}
$('btnPng').onclick = ()=>exportStill('png');
$('btnJpg').onclick = ()=>exportStill('jpg');

let workerUrl = null;
async function getWorkerUrl(){
  if (workerUrl) return workerUrl;
  const txt = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js').then(r=>r.text());
  workerUrl = URL.createObjectURL(new Blob([txt], { type:'application/javascript' }));
  return workerUrl;
}
const gifStatus = $('gifStatus');
$('btnGif').onclick = async ()=>{
  const btn = $('btnGif');
  btn.disabled = true;
  gifStatus.textContent = '프레임 준비 중…';
  try{
    const wUrl = await getWorkerUrl();
    const gs = state.gifScale;
    const gw = Math.round(W * gs), gh = Math.round(H * gs);
    const gif = new GIF({ workers:2, quality:8, width:gw, height:gh, workerScript:wUrl });
    const c = document.createElement('canvas');
    c.width = gw; c.height = gh;
    const ctx = c.getContext('2d');

    const fps = 25;
    const total = totalSec();
    const n = Math.round(fps * total);
    render(ctx, 0, { scale:gs });
    gif.addFrame(ctx, { copy:true, delay:300 });            // 빈 화면 잠깐
    for (let f = 1; f <= n; f++){
      render(ctx, f / n, { scale:gs });
      gif.addFrame(ctx, { copy:true, delay:1000 / fps });
    }
    render(ctx, 1, { scale:gs });
    gif.addFrame(ctx, { copy:true, delay:1800 });           // 완성 화면 유지

    gif.on('progress', p=>{ gifStatus.textContent = 'GIF 생성 ' + Math.round(p * 100) + '%'; });
    gif.on('finished', blob=>{
      download(blob, 'lineup.gif');
      gifStatus.textContent = '완료 ✦';
      btn.disabled = false;
      setTimeout(()=>gifStatus.textContent = '', 3000);
    });
    gif.render();
  } catch(err){
    gifStatus.textContent = 'GIF 생성 실패 — 네트워크 확인';
    btn.disabled = false;
  }
};

draw();
</script>
</body>
