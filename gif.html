<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사선 분할 에디터</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16181f;
    --paper:#f4f4f1;
    --line:#dcdcd6;
    --accent:#2f7a6f;
    --accent-soft:#e4efec;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--paper);
    font-family:'Gowun Dodum',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  header{
    background:var(--ink);
    color:#f5f4ef;
    padding:20px 26px 18px;
    letter-spacing:.04em;
  }
  header h1{
    font-family:'Gowun Batang',serif;
    font-size:19px;
    font-weight:700;
  }
  header p{
    font-size:12px;
    opacity:.62;
    margin-top:5px;
  }
  main{
    max-width:1080px;
    margin:0 auto;
    padding:22px 18px 60px;
  }
  .stage{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    box-shadow:0 8px 26px rgba(22,24,31,.06);
  }
  canvas#view{
    width:100%;
    display:block;
    border-radius:8px;
    touch-action:none;
    cursor:grab;
  }
  .hint-line{
    font-size:12px;
    color:#8a8a83;
    margin:10px 4px 0;
    line-height:1.7;
  }
  .controls{
    margin-top:18px;
    display:grid;
    gap:14px;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
  }
  .card h2{
    font-size:13px;
    font-weight:400;
    color:#6d6d66;
    letter-spacing:.08em;
    margin-bottom:12px;
  }
  .card h2 b{color:var(--accent);font-weight:400;}
  .row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:9px;
  }
  .row + .row{margin-top:11px;}
  button.pill{
    font-family:inherit;
    font-size:13px;
    padding:8px 17px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  button.pill:hover{border-color:var(--accent);background:var(--accent-soft);}
  button.pill.primary{
    background:var(--ink);
    color:#f5f4ef;
    border-color:var(--ink);
  }
  button.pill.primary:hover{background:#2a2d38;}
  button.pill.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  button.pill:disabled{opacity:.4;cursor:default;}
  label.inline{
    font-size:13px;
    color:#55554f;
    display:flex;
    align-items:center;
    gap:8px;
  }
  input[type=range]{width:170px;accent-color:var(--accent);}
  input[type=color]{
    width:34px;height:30px;border:1px solid var(--line);
    border-radius:8px;background:#fff;padding:2px;cursor:pointer;
  }
  input[type=number]{
    font-family:inherit;font-size:13px;width:62px;
    padding:6px 8px;border:1px solid var(--line);border-radius:8px;
  }
  .seg{
    display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;
  }
  .seg button{
    font-family:inherit;font-size:13px;padding:8px 16px;border:none;background:#fff;cursor:pointer;color:#77776f;
  }
  .seg button.on{background:var(--accent);color:#fff;}
  #gifStatus{
    font-size:12px;color:var(--accent);min-width:90px;
  }
  footer{
    text-align:center;font-size:11px;color:#a5a59d;padding:8px 0 26px;letter-spacing:.1em;
  }
  @media (max-width:560px){
    input[type=range]{width:120px;}
  }
</style>
</head>
<body>

<header>
  <h1>⊹ 사선 분할 에디터</h1>
  <p>두 개의 사다리꼴 칸에 사진을 채우고 &nbsp;✦&nbsp; 슬라이드 인 애니메이션을 GIF · PNG · JPG로 저장</p>
</header>

<main>
  <div class="stage">
    <canvas id="view" width="1500" height="1000"></canvas>
    <p class="hint-line">칸을 클릭해 선택 → 사진 넣기 · 사진을 캔버스로 끌어다 놓아도 됩니다 · 드래그로 위치 이동, 휠(또는 크기 슬라이더)로 확대·축소</p>
  </div>

  <div class="controls">

    <div class="card">
      <h2>선택된 칸 &nbsp;—&nbsp; <b id="selName">없음</b></h2>
      <div class="row">
        <button class="pill primary" id="btnUpload">사진 넣기</button>
        <button class="pill" id="btnFlipH">좌우 반전</button>
        <button class="pill" id="btnFlipV">상하 반전</button>
        <button class="pill" id="btnReset">위치·크기 초기화</button>
        <button class="pill" id="btnClear">사진 지우기</button>
      </div>
      <div class="row">
        <label class="inline">크기
          <input type="range" id="scale" min="0.3" max="4" step="0.01" value="1">
        </label>
        <label class="inline">배경색
          <input type="color" id="bgColor" value="#ffffff">
        </label>
      </div>
    </div>

    <div class="card">
      <h2>애니메이션 &nbsp;·&nbsp; 저장</h2>
      <div class="row">
        <button class="pill primary" id="btnPlay">▶ 재생</button>
        <label class="inline">길이(초)
          <input type="number" id="dur" min="0.5" max="4" step="0.1" value="1.4">
        </label>
        <label class="inline">GIF 크기
          <span class="seg" id="gifSizeSeg">
            <button data-v="0.4">소</button>
            <button data-v="0.55" class="on">중</button>
            <button data-v="0.8">대</button>
          </span>
        </label>
      </div>
      <div class="row">
        <button class="pill" id="btnPng">PNG 저장</button>
        <button class="pill" id="btnJpg">JPG 저장</button>
        <button class="pill" id="btnGif">GIF 저장</button>
        <span id="gifStatus"></span>
      </div>
    </div>

  </div>
</main>

<footer>✦ &nbsp; 1500 × 1000 &nbsp; ✦</footer>

<input type="file" id="file" accept="image/*" hidden>

<script>
/* ───────── 기본 지오메트리 ─────────
   캔버스 1500×1000, 여백 m, 가운데 사선 분할.
   분할선 상단은 중앙보다 오른쪽(+s), 하단은 왼쪽(−s) → 두 칸 면적 동일. */
const W = 1500, H = 1000;
const m = 42;          // 바깥 여백
const s = 78;          // 사선 기울기 (상/하 오프셋)
const g = 34;          // 두 칸 사이 간격
const cx = W / 2;

const leftPoly  = [[m, m], [cx + s - g/2, m], [cx - s - g/2, H - m], [m, H - m]];
const rightPoly = [[cx + s + g/2, m], [W - m, m], [W - m, H - m], [cx - s + g/2, H - m]];

// 사선 방향 단위벡터 (위→아래)
const dl = Math.hypot(-2*s, H - 2*m);
const dir = [(-2*s)/dl, (H - 2*m)/dl];
const travel = (H / Math.abs(dir[1])) * 1.06;   // 화면을 완전히 벗어나는 이동 거리

/* 왼쪽 칸: 짧은 밑변이 아래 → 위에서 아래로 미끄러져 들어옴
   오른쪽 칸: 짧은 밑변이 위 → 아래에서 위로 미끄러져 들어옴 */
const panels = [
  { name:'왼쪽 칸',  poly:leftPoly,  from:[-dir[0]*travel, -dir[1]*travel], delay:0.00,
    img:null, ox:0, oy:0, scale:1, fx:false, fy:false },
  { name:'오른쪽 칸', poly:rightPoly, from:[ dir[0]*travel,  dir[1]*travel], delay:0.18,
    img:null, ox:0, oy:0, scale:1, fx:false, fy:false },
];
panels.forEach(p=>{
  const xs = p.poly.map(q=>q[0]), ys = p.poly.map(q=>q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  p.bb = { x:x0, y:y0, w:x1-x0, h:y1-y0, cx:(x0+x1)/2, cy:(y0+y1)/2 };
});

const state = { sel:-1, bg:'#ffffff', dur:1.4, gifScale:0.55, animT:1, playing:false };

/* ───────── 렌더링 ───────── */
const view = document.getElementById('view');
const vctx = view.getContext('2d');

function ease(t){ return 1 - Math.pow(1 - t, 3); }
function progress(p, t){
  const span = 0.82;
  return ease(Math.min(1, Math.max(0, (t - p.delay) / span)));
}
function pathPoly(ctx, poly){
  ctx.beginPath();
  ctx.moveTo(poly[0][0], poly[0][1]);
  for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
  ctx.closePath();
}

function render(ctx, t, opts = {}){
  const sc = opts.scale || 1;
  ctx.save();
  ctx.setTransform(sc, 0, 0, sc, 0, 0);
  ctx.fillStyle = state.bg;
  ctx.fillRect(0, 0, W, H);

  panels.forEach((p, i)=>{
    const pr = progress(p, t);
    const offX = p.from[0] * (1 - pr);
    const offY = p.from[1] * (1 - pr);

    ctx.save();
    ctx.translate(offX, offY);
    pathPoly(ctx, p.poly);
    ctx.clip();

    // 칸 바탕
    ctx.fillStyle = p.img ? '#ffffff' : '#efefec';
    ctx.fillRect(p.bb.x, p.bb.y, p.bb.w, p.bb.h);

    if (p.img){
      const base = Math.max(p.bb.w / p.img.width, p.bb.h / p.img.height);
      const k = base * p.scale;
      ctx.translate(p.bb.cx + p.ox, p.bb.cy + p.oy);
      ctx.scale(p.fx ? -k : k, p.fy ? -k : k);
      ctx.drawImage(p.img, -p.img.width / 2, -p.img.height / 2);
    } else if (opts.edit){
      ctx.fillStyle = '#b3b3ab';
      ctx.font = '28px "Gowun Dodum", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⊹', p.bb.cx, p.bb.cy - 14);
      ctx.font = '22px "Gowun Dodum", sans-serif';
      ctx.fillText('클릭해서 선택 후 사진 넣기', p.bb.cx, p.bb.cy + 26);
    }
    ctx.restore();
  });

  // 선택 표시 (편집 화면에서만)
  if (opts.edit && state.sel >= 0){
    const p = panels[state.sel];
    ctx.save();
    pathPoly(ctx, p.poly);
    ctx.lineWidth = 5;
    ctx.setLineDash([16, 12]);
    ctx.strokeStyle = '#2f7a6f';
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function draw(){ render(vctx, state.animT, { edit:!state.playing }); }
draw();

/* ───────── 선택 · 드래그 · 확대 ───────── */
function toCanvas(e){
  const r = view.getBoundingClientRect();
  return [ (e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height ];
}
function inPoly(pt, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > pt[1]) !== (yj > pt[1]) &&
        pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function panelAt(pt){
  for (let i = 0; i < panels.length; i++) if (inPoly(pt, panels[i].poly)) return i;
  return -1;
}

let drag = null;
view.addEventListener('pointerdown', e=>{
  if (state.playing) return;
  const pt = toCanvas(e);
  const idx = panelAt(pt);
  if (idx >= 0){
    selectPanel(idx);
    const p = panels[idx];
    if (p.img){
      drag = { idx, sx:pt[0], sy:pt[1], ox:p.ox, oy:p.oy };
      view.setPointerCapture(e.pointerId);
      view.style.cursor = 'grabbing';
    }
  }
  draw();
});
view.addEventListener('pointermove', e=>{
  if (!drag) return;
  const pt = toCanvas(e);
  const p = panels[drag.idx];
  p.ox = drag.ox + (pt[0] - drag.sx);
  p.oy = drag.oy + (pt[1] - drag.sy);
  draw();
});
['pointerup','pointercancel'].forEach(ev=>view.addEventListener(ev, ()=>{
  drag = null; view.style.cursor = 'grab';
}));
view.addEventListener('wheel', e=>{
  if (state.sel < 0 || !panels[state.sel].img) return;
  e.preventDefault();
  const p = panels[state.sel];
  p.scale = Math.min(4, Math.max(0.3, p.scale * (e.deltaY < 0 ? 1.06 : 0.94)));
  scaleSlider.value = p.scale;
  draw();
}, { passive:false });

/* 드래그 앤 드롭으로 사진 넣기 */
view.addEventListener('dragover', e=>e.preventDefault());
view.addEventListener('drop', e=>{
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f || !f.type.startsWith('image/')) return;
  const idx = panelAt(toCanvas(e));
  if (idx >= 0){ selectPanel(idx); loadImageTo(idx, f); }
});

/* ───────── 컨트롤 ───────── */
const selName = document.getElementById('selName');
const scaleSlider = document.getElementById('scale');
const fileInput = document.getElementById('file');

function selectPanel(i){
  state.sel = i;
  selName.textContent = panels[i].name;
  scaleSlider.value = panels[i].scale;
}
function loadImageTo(idx, file){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>{
    const p = panels[idx];
    p.img = img; p.ox = 0; p.oy = 0; p.scale = 1; p.fx = false; p.fy = false;
    scaleSlider.value = 1;
    draw();
  };
  img.src = url;
}

document.getElementById('btnUpload').onclick = ()=>{
  if (state.sel < 0){ selectPanel(0); draw(); }
  fileInput.click();
};
fileInput.onchange = ()=>{
  if (fileInput.files[0] && state.sel >= 0) loadImageTo(state.sel, fileInput.files[0]);
  fileInput.value = '';
};
scaleSlider.oninput = ()=>{
  if (state.sel >= 0){ panels[state.sel].scale = parseFloat(scaleSlider.value); draw(); }
};
document.getElementById('btnFlipH').onclick = ()=>{
  if (state.sel >= 0 && panels[state.sel].img){ panels[state.sel].fx = !panels[state.sel].fx; draw(); }
};
document.getElementById('btnFlipV').onclick = ()=>{
  if (state.sel >= 0 && panels[state.sel].img){ panels[state.sel].fy = !panels[state.sel].fy; draw(); }
};
document.getElementById('btnReset').onclick = ()=>{
  if (state.sel < 0) return;
  const p = panels[state.sel];
  p.ox = 0; p.oy = 0; p.scale = 1; p.fx = false; p.fy = false;
  scaleSlider.value = 1; draw();
};
document.getElementById('btnClear').onclick = ()=>{
  if (state.sel < 0) return;
  panels[state.sel].img = null; draw();
};
document.getElementById('bgColor').oninput = e=>{ state.bg = e.target.value; draw(); };
document.getElementById('dur').onchange = e=>{
  state.dur = Math.min(4, Math.max(0.5, parseFloat(e.target.value) || 1.4));
  e.target.value = state.dur;
};
document.getElementById('gifSizeSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  state.gifScale = parseFloat(b.dataset.v);
  document.querySelectorAll('#gifSizeSeg button').forEach(x=>x.classList.toggle('on', x === b));
});

/* ───────── 애니메이션 미리보기 ───────── */
document.getElementById('btnPlay').onclick = ()=>{
  if (state.playing) return;
  state.playing = true;
  const t0 = performance.now();
  const dur = state.dur * 1000;
  (function step(now){
    const t = Math.min(1, (now - t0) / dur);
    state.animT = t;
    render(vctx, t, { edit:false });
    if (t < 1) requestAnimationFrame(step);
    else { state.playing = false; state.animT = 1; draw(); }
  })(t0);
};

/* ───────── 저장 ───────── */
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function exportStill(type){
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  render(c.getContext('2d'), 1, {});
  const mime = type === 'jpg' ? 'image/jpeg' : 'image/png';
  c.toBlob(b=>download(b, 'panel.' + type), mime, 0.92);
}
document.getElementById('btnPng').onclick = ()=>exportStill('png');
document.getElementById('btnJpg').onclick = ()=>exportStill('jpg');

let workerUrl = null;
async function getWorkerUrl(){
  if (workerUrl) return workerUrl;
  const txt = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js').then(r=>r.text());
  workerUrl = URL.createObjectURL(new Blob([txt], { type:'application/javascript' }));
  return workerUrl;
}
const gifStatus = document.getElementById('gifStatus');
document.getElementById('btnGif').onclick = async ()=>{
  const btn = document.getElementById('btnGif');
  btn.disabled = true;
  gifStatus.textContent = '프레임 준비 중…';
  try{
    const wUrl = await getWorkerUrl();
    const gs = state.gifScale;
    const gw = Math.round(W * gs), gh = Math.round(H * gs);
    const gif = new GIF({ workers:2, quality:8, width:gw, height:gh, workerScript:wUrl });
    const c = document.createElement('canvas');
    c.width = gw; c.height = gh;
    const ctx = c.getContext('2d');

    const fps = 25;
    const n = Math.round(fps * state.dur);
    render(ctx, 0, { scale:gs });
    gif.addFrame(ctx, { copy:true, delay:300 });          // 빈 화면 잠깐 유지
    for (let f = 1; f <= n; f++){
      render(ctx, f / n, { scale:gs });
      gif.addFrame(ctx, { copy:true, delay:1000 / fps });
    }
    render(ctx, 1, { scale:gs });
    gif.addFrame(ctx, { copy:true, delay:1400 });         // 완성 화면 유지

    gif.on('progress', p=>{ gifStatus.textContent = 'GIF 생성 ' + Math.round(p * 100) + '%'; });
    gif.on('finished', blob=>{
      download(blob, 'panel.gif');
      gifStatus.textContent = '완료 ✦';
      btn.disabled = false;
      setTimeout(()=>gifStatus.textContent = '', 3000);
    });
    gif.render();
  } catch(err){
    gifStatus.textContent = 'GIF 생성 실패 — 네트워크 확인';
    btn.disabled = false;
  }
};
</script>
</body>
</html>
