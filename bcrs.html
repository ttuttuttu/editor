<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>명함 · 관계 시트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#f2f1ee;       /* 작업실 배경 (고정) */
    --panel:#faf9f7;    /* 폼 배경 (고정) */
    --line:#e3e1dc;     /* 옅은 선 (고정) */
    --card:#ffffff;     /* 카드 배경 (헥스 입력) */
    --ink:#2b2b2b;      /* 카드 글자 (헥스 입력) */
    --accent:#8c4a5a;   /* 포인트 (헥스 입력) */
  }
  *{box-sizing:border-box}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:#333;
    font-family:'Noto Sans KR',sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    overflow-x:hidden;
  }

  /* ── 상단: 모드 전환만, 중앙 배치 ── */
  .topbar{
    padding:18px 0 14px; display:flex; justify-content:center;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  .modes{ display:flex; border:1px solid #2b2b2b; border-radius:22px; overflow:hidden; }
  .modes button{
    font:inherit; font-size:13.5px; padding:8px 26px; cursor:pointer;
    background:#fff; color:#2b2b2b; border:none;
  }
  .modes button[aria-pressed="true"]{ background:#2b2b2b; color:#fff; }

  .work{ flex:1; display:grid; grid-template-columns:340px 1fr; }
  @media (max-width:880px){ .work{ grid-template-columns:1fr; } }

  /* ── 폼 ── */
  .form{
    padding:20px 20px 44px; border-right:1px solid var(--line);
    background:var(--panel); display:flex; flex-direction:column; gap:14px;
  }
  @media (max-width:880px){ .form{ border-right:none; border-bottom:1px solid var(--line); } }
  .fgroup{ display:flex; flex-direction:column; gap:5px; }
  .fgroup label{ font-size:11.5px; letter-spacing:.12em; color:#8a8781; font-weight:500; }
  .fgroup input[type=text], .fgroup textarea{
    font:inherit; font-size:14px; padding:8px 11px;
    border:1px solid var(--line); border-radius:7px;
    background:#fff; color:#2b2b2b; outline:none;
    width:100%;
  }
  .fgroup input:focus, .fgroup textarea:focus{ border-color:#2b2b2b; }
  .fgroup textarea{ resize:vertical; min-height:56px; }
  .hint{ font-size:11px; color:#a09c95; }
  .sep{ border:none; border-top:1px dashed var(--line); margin:4px 0; }

  /* ── 모바일 확대 튐 방지: iOS는 16px 미만 입력칸에 포커스되면 화면을 확대함 ── */
  @media (max-width:880px){
    .fgroup input[type=text], .fgroup textarea,
    .gauge-row input[type=text], .gauge-row select,
    .hexrow input[type=text]{
      font-size:16px;
    }
  }

  /* 헥스 입력 */
  .hexrow{ display:grid; grid-template-columns:64px 1fr 34px; gap:8px; align-items:center; }
  .hexrow .hname{ font-size:12.5px; }
  .hexrow input[type=text]{
    font-family:monospace; font-size:13px; padding:7px 10px;
    border:1px solid var(--line); border-radius:7px; outline:none; width:100%;
  }
  .hexrow input[type=text]:focus{ border-color:#2b2b2b; }
  .hexrow .sw{ width:30px; height:30px; border-radius:7px; border:1px solid var(--line); }

  /* 게이지 행: [모양][이름][세기][삭제] */
  .gauge-rows{ display:flex; flex-direction:column; gap:8px; }
  .gauge-row{ display:grid; grid-template-columns:52px 1fr 76px 26px; gap:7px; align-items:center; }
  .gauge-row select{
    font-size:15px; padding:6px 2px; text-align:center;
    border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--accent);
    outline:none; cursor:pointer; width:100%;
  }
  .gauge-row input[type=text]{
    font:inherit; font-size:13px; padding:7px 10px;
    border:1px solid var(--line); border-radius:7px; background:#fff; outline:none; width:100%;
  }
  .gauge-row input[type=range]{ width:100%; accent-color:#2b2b2b; }
  .gauge-row .del{
    width:26px; height:26px; border-radius:50%; cursor:pointer;
    border:1px solid var(--line); background:#fff; font-size:13px; line-height:1;
  }
  .addrow{
    align-self:flex-start; font:inherit; font-size:12px; cursor:pointer;
    padding:6px 14px; border-radius:16px;
    border:1px dashed #2b2b2b; background:transparent; color:#2b2b2b;
  }

  /* 사진 슬롯 컨트롤 */
  .photoct{ display:flex; gap:6px; }
  .photoct button{
    font:inherit; font-size:12.5px; padding:6px 14px; cursor:pointer;
    border:1px solid var(--line); border-radius:16px; background:#fff; color:#2b2b2b;
  }
  .photoct button[aria-pressed="true"]{ background:#2b2b2b; color:#fff; border-color:#2b2b2b; }
  .photoedit{ display:flex; flex-direction:column; gap:8px; padding:10px; border:1px solid var(--line); border-radius:9px; background:#fff; }
  .photoedit .prow{ display:flex; align-items:center; gap:8px; }
  .photoedit .prow span{ font-size:11.5px; color:#8a8781; width:34px; }
  .photoedit input[type=range]{ flex:1; accent-color:#2b2b2b; }
  .photoedit .pbtns{ display:flex; gap:6px; }
  .photoedit .pbtns button{
    font:inherit; font-size:12px; padding:5px 12px; cursor:pointer;
    border:1px solid var(--line); border-radius:14px; background:#fff;
  }

  /* ── 미리보기 ── */
  .stage{ padding:36px 26px 46px; display:flex; flex-direction:column; align-items:center; gap:22px; }
  @media (max-width:880px){ .stage{ padding:26px 14px 40px; } }

  /* ══ 명함: 실제 명함 비율 90×50 ══ */
  .bizcard{
    width:min(520px,94vw); aspect-ratio:9/5;
    background:var(--card); color:var(--ink);
    border:1px solid var(--line);
    box-shadow:0 14px 34px -24px rgba(0,0,0,.45);
    padding:7.2% 8%;
    display:flex; flex-direction:column; justify-content:space-between;
    font-weight:400;
  }
  .bizcard .top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .bizcard .co{ font-size:12.5px; font-weight:700; letter-spacing:.18em; color:var(--accent); }
  .bizcard .dept{ font-size:10.5px; color:color-mix(in srgb, var(--ink) 60%, transparent); letter-spacing:.06em; }
  .bizcard .idblock{ margin-top:2px; }
  .bizcard .nm{ font-size:24px; font-weight:700; letter-spacing:.05em; line-height:1.2; }
  .bizcard .ti{ font-size:12px; margin-top:2px; color:color-mix(in srgb, var(--ink) 72%, transparent); letter-spacing:.08em; }
  .bizcard .brule{ width:26px; border:none; border-top:2px solid var(--accent); margin:10px 0 0 0; }
  .bizcard .contact{ font-size:10.5px; line-height:1.85; letter-spacing:.03em; color:color-mix(in srgb, var(--ink) 82%, transparent); }
  .bizcard .contact b{ font-weight:500; color:var(--accent); margin-right:6px; }

  /* ══ 관계 시트 ══ */
  .relcard{
    width:min(520px,94vw);
    background:var(--card); color:var(--ink);
    border:1px solid var(--line); border-radius:16px;
    padding:34px 36px 28px;
    box-shadow:0 18px 40px -28px rgba(0,0,0,.45);
  }
  @media (max-width:880px){ .relcard{ padding:28px 22px 24px; } }
  .relcard .eyebrow{
    text-align:center; font-size:11px; letter-spacing:.3em;
    color:var(--accent); margin-bottom:14px; font-weight:500;
  }
  .photos{ display:flex; justify-content:center; gap:18px; margin-bottom:16px; }
  .pframe{
    width:108px; height:108px; border-radius:50%;
    border:1.5px solid var(--accent);
    background-color:color-mix(in srgb, var(--accent) 8%, var(--card));
    background-repeat:no-repeat;
    overflow:hidden; cursor:grab; touch-action:none;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; color:color-mix(in srgb, var(--ink) 45%, transparent);
  }
  .pframe:active{ cursor:grabbing; }
  .pairline{
    display:flex; align-items:baseline; justify-content:center; gap:14px;
    margin:2px 0 4px; text-align:center; flex-wrap:wrap;
  }
  .pairline .pname{ font-family:'Gowun Batang',serif; font-weight:700; font-size:24px; }
  .pairline .amp{ color:var(--accent); font-size:15px; }
  .relword{ text-align:center; font-size:12.5px; color:var(--accent); letter-spacing:.26em; margin-bottom:14px; }
  .rule{ border:none; border-top:1px solid var(--line); margin:14px 0; }
  .gauges{ display:flex; flex-direction:column; gap:12px; margin-top:6px; }
  .g{ display:grid; grid-template-columns:80px 1fr 34px; gap:10px; align-items:center; }
  @media (max-width:880px){ .g{ grid-template-columns:68px 1fr 30px; gap:7px; } }
  .g .gname{ font-size:13.5px; }
  .g .track{
    position:relative; height:20px; display:flex; align-items:center;
    letter-spacing:5px; font-size:15px;
    color:color-mix(in srgb, var(--accent) 15%, var(--card));
    overflow:hidden; white-space:nowrap;
  }
  .g .fill{
    position:absolute; inset:0; display:flex; align-items:center;
    letter-spacing:5px; font-size:15px; color:var(--accent);
    overflow:hidden; white-space:nowrap;
  }
  .g .gnum{ font-size:11.5px; text-align:right; color:color-mix(in srgb, var(--ink) 55%, transparent); }
  .tags{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin-top:16px; }
  .tag{ font-size:12px; padding:4px 12px; border-radius:14px; border:1px solid var(--accent); color:var(--accent); }
  .memo{ margin-top:16px; font-size:13.5px; line-height:1.75; white-space:pre-wrap; }
  .footline{
    margin-top:18px; font-size:10.5px; letter-spacing:.22em;
    color:color-mix(in srgb, var(--ink) 48%, transparent);
  }

  /* ── 출력 ── */
  .outbar{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .out{
    font:inherit; font-size:13px; cursor:pointer;
    padding:9px 20px; border-radius:20px;
    border:1px solid #2b2b2b; background:#fff; color:#2b2b2b;
  }
  .out:hover{ background:#2b2b2b; color:#fff; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(16px);
    background:#2b2b2b; color:#fff; padding:9px 18px; border-radius:18px;
    font-size:12.5px; opacity:0; pointer-events:none; transition:.25s ease; z-index:80;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .hidden{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

  <div class="topbar">
    <div class="modes" role="tablist">
      <button id="modeCard" aria-pressed="true">명함</button>
      <button id="modeRel" aria-pressed="false">관계 시트</button>
    </div>
  </div>

  <div class="work">
    <!-- ══════════ 폼 ══════════ -->
    <div class="form">

      <!-- 색: 헥스 직접 입력 -->
      <div class="fgroup">
        <label>색 (헥스코드)</label>
        <div class="hexrow"><span class="hname">배경</span><input type="text" id="hexCard" value="#ffffff" maxlength="7"><div class="sw" id="swCard"></div></div>
        <div class="hexrow"><span class="hname">글자</span><input type="text" id="hexInk" value="#2b2b2b" maxlength="7"><div class="sw" id="swInk"></div></div>
        <div class="hexrow"><span class="hname">포인트</span><input type="text" id="hexAccent" value="#8c4a5a" maxlength="7"><div class="sw" id="swAccent"></div></div>
      </div>
      <hr class="sep">

      <!-- ── 명함 폼 ── -->
      <div id="formCard">
        <div class="fgroup"><label>회사 / 소속</label><input type="text" id="bCo" placeholder="주식회사 ○○"></div>
        <div class="fgroup"><label>부서 · 팀</label><input type="text" id="bDept" placeholder="기획팀"></div>
        <div class="fgroup"><label>이름</label><input type="text" id="bName" placeholder="홍길동"></div>
        <div class="fgroup"><label>직함</label><input type="text" id="bTitle" placeholder="대리 / Manager"></div>
        <div class="fgroup"><label>전화</label><input type="text" id="bTel" placeholder="010-0000-0000"></div>
        <div class="fgroup"><label>이메일</label><input type="text" id="bMail" placeholder="hong@company.com"></div>
        <div class="fgroup"><label>주소</label><input type="text" id="bAddr" placeholder="서울시 ○○구 ○○로 00"></div>
        <div class="fgroup"><label>웹 / SNS</label><input type="text" id="bWeb" placeholder="company.com"></div>
      </div>

      <!-- ── 관계 시트 폼 ── -->
      <div id="formRel" class="hidden">
        <div class="fgroup">
          <label>사진</label>
          <div class="photoct" id="photoct">
            <button data-n="0" aria-pressed="true">없음</button>
            <button data-n="1" aria-pressed="false">1칸</button>
            <button data-n="2" aria-pressed="false">2칸</button>
          </div>
        </div>
        <div class="photoedit hidden" id="pe0">
          <div class="pbtns"><button id="pu0">사진 1 올리기</button><button id="px0">지우기</button></div>
          <div class="prow"><span>확대</span><input type="range" id="pz0" min="100" max="300" value="100"></div>
          <div class="hint">사진을 드래그하면 위치를 옮길 수 있어요</div>
        </div>
        <div class="photoedit hidden" id="pe1">
          <div class="pbtns"><button id="pu1">사진 2 올리기</button><button id="px1">지우기</button></div>
          <div class="prow"><span>확대</span><input type="range" id="pz1" min="100" max="300" value="100"></div>
        </div>
        <input type="file" id="pf0" accept="image/*" class="hidden">
        <input type="file" id="pf1" accept="image/*" class="hidden">
        <hr class="sep">
        <div class="fgroup"><label>이름 A</label><input type="text" id="rA" placeholder="홍길동"></div>
        <div class="fgroup"><label>이름 B</label><input type="text" id="rB" placeholder="성춘향"></div>
        <div class="fgroup"><label>관계 한 단어</label><input type="text" id="rWord" placeholder="예: 공생 / 앙숙 / 소꿉지기"></div>
        <div class="fgroup">
          <label>지표 <span style="letter-spacing:0">(맨 앞에서 모양을 지표마다 따로 고를 수 있어요)</span></label>
          <div class="gauge-rows" id="gaugeRows"></div>
          <button class="addrow" id="addGauge">+ 지표 추가</button>
          <div class="hint">이름을 지우면 그 지표는 카드에서 빠져요</div>
        </div>
        <div class="fgroup"><label>태그 (쉼표로 구분)</label><input type="text" id="rTags" placeholder="서로만 아는 것, 미해결"></div>
        <div class="fgroup"><label>메모</label><textarea id="rMemo" placeholder="관계에 대한 짧은 기록"></textarea></div>
        <div class="fgroup"><label>하단 표기</label><input type="text" id="rFoot" placeholder="예: RELATION SHEET NO.01"></div>
      </div>

    </div>

    <!-- ══════════ 미리보기 ══════════ -->
    <div class="stage">

      <!-- 명함 -->
      <div class="bizcard" id="cardView">
        <div class="top">
          <span class="co" id="vCo"></span>
          <span class="dept" id="vDept"></span>
        </div>
        <div class="idblock">
          <div class="nm" id="vName">이름</div>
          <div class="ti" id="vTitle"></div>
          <hr class="brule">
        </div>
        <div class="contact" id="vContact"></div>
      </div>

      <!-- 관계 시트 -->
      <div class="relcard hidden" id="relView">
        <div class="eyebrow">RELATION SHEET</div>
        <div class="photos hidden" id="vPhotos">
          <div class="pframe" id="fr0">사진 1</div>
          <div class="pframe hidden" id="fr1">사진 2</div>
        </div>
        <div class="pairline">
          <span class="pname" id="vA">A</span>
          <span class="amp">&amp;</span>
          <span class="pname" id="vB">B</span>
        </div>
        <div class="relword" id="vWord"></div>
        <hr class="rule">
        <div class="gauges" id="vGauges"></div>
        <div class="tags" id="vRTags"></div>
        <div class="memo" id="vMemo"></div>
        <div class="footline" id="vRFoot"></div>
      </div>

      <div class="outbar">
        <button class="out" id="jsonSave">기록 저장</button>
        <button class="out" id="jsonLoad">기록 불러오기</button>
        <input type="file" id="jsonFile" accept="application/json" class="hidden">
        <button class="out" id="pngBtn">PNG로 찍기</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const rootS = document.documentElement.style;
  const toast = $('toast');
  function flash(m){ toast.textContent=m; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1500); }
  function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  /* ══ 헥스 입력 ══ */
  const HEX = [
    {inp:'hexCard', sw:'swCard', varName:'--card'},
    {inp:'hexInk', sw:'swInk', varName:'--ink'},
    {inp:'hexAccent', sw:'swAccent', varName:'--accent'},
  ];
  function applyHex(){
    HEX.forEach(h=>{
      let v=$(h.inp).value.trim();
      if(v && v[0]!=='#') v='#'+v;
      if(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)){
        rootS.setProperty(h.varName, v);
        $(h.sw).style.background=v;
      }
    });
  }
  HEX.forEach(h=>$(h.inp).addEventListener('input',()=>{ applyHex(); save(); }));

  /* ══ 모드 전환 ══ */
  let mode='card';
  function setMode(m){
    mode=m;
    $('modeCard').setAttribute('aria-pressed', String(m==='card'));
    $('modeRel').setAttribute('aria-pressed', String(m==='rel'));
    $('formCard').classList.toggle('hidden', m!=='card');
    $('formRel').classList.toggle('hidden', m!=='rel');
    $('cardView').classList.toggle('hidden', m!=='card');
    $('relView').classList.toggle('hidden', m!=='rel');
    save();
  }
  $('modeCard').addEventListener('click',()=>setMode('card'));
  $('modeRel').addEventListener('click',()=>setMode('rel'));

  /* ══ 명함 렌더 ══ */
  function renderCard(){
    $('vCo').textContent=$('bCo').value;
    $('vDept').textContent=$('bDept').value;
    $('vName').textContent=$('bName').value||'이름';
    $('vTitle').textContent=$('bTitle').value;
    const rows=[];
    if($('bTel').value)  rows.push('<b>T</b>'+esc($('bTel').value));
    if($('bMail').value) rows.push('<b>E</b>'+esc($('bMail').value));
    if($('bAddr').value) rows.push('<b>A</b>'+esc($('bAddr').value));
    if($('bWeb').value)  rows.push('<b>W</b>'+esc($('bWeb').value));
    $('vContact').innerHTML=rows.join('<br>');
  }
  ['bCo','bDept','bName','bTitle','bTel','bMail','bAddr','bWeb'].forEach(id=>
    $(id).addEventListener('input',()=>{ renderCard(); save(); }));

  /* ══ 지표 모양: 동글동글한 세트, 지표마다 개별 선택 ══
     \uFE0E = 텍스트 표시 강제 (모바일에서 이모지로 바뀌는 것 방지) */
  const T='\uFE0E';
  const GLYPHS=[
    {name:'하트',     ch:'\u2665'+T},        /* ♥ */
    {name:'빈하트',   ch:'\u2661'+T},        /* ♡ */
    {name:'잎하트',   ch:'\u2765'+T},        /* ❥ */
    {name:'리본하트', ch:'\u1863\u{10B69}'}, /* ᡣ𐭩 */
    {name:'둥근하트', ch:'\u10E6'},          /* ღ */
    {name:'별',       ch:'\u2605'+T},        /* ★ */
    {name:'빈별',     ch:'\u269D'+T},        /* ⚝ */
    {name:'반짝임',   ch:'\u2726'+T},        /* ✦ */
    {name:'동글별',   ch:'\u272A'+T},        /* ✪ */
    {name:'꽃',       ch:'\u273F'+T},        /* ✿ */
    {name:'겹꽃',     ch:'\u2740'+T},        /* ❀ */
    {name:'네잎',     ch:'\u2724'+T},        /* ✤ */
    {name:'여덟잎',   ch:'\u274B'+T},        /* ❋ */
    {name:'눈꽃잎',   ch:'\u273D'+T},        /* ✽ */
    {name:'원',       ch:'\u25CF'+T},        /* ● */
    {name:'과녁',     ch:'\u25C9'+T},        /* ◉ */
    {name:'달',       ch:'\u263E'+T},        /* ☾ */
    {name:'눈꽃',     ch:'\u2745'+T},        /* ❅ */
  ];

  /* ══ 게이지 행 ══ */
  const DEFAULT_GAUGES=[
    {name:'호감', val:70, glyph:GLYPHS[2].ch},   /* ❥ */
    {name:'신뢰', val:55, glyph:GLYPHS[7].ch},   /* ✦ */
    {name:'거리감', val:30, glyph:GLYPHS[1].ch}, /* ♡ */
    {name:'긴장', val:45, glyph:GLYPHS[6].ch},   /* ⚝ */
  ];
  const gaugeRows=$('gaugeRows');
  function addGaugeRow(name='', val=50, gl=GLYPHS[0].ch){
    const row=document.createElement('div'); row.className='gauge-row';
    const sel=document.createElement('select');
    GLYPHS.forEach(g=>{
      const o=document.createElement('option');
      o.value=g.ch; o.textContent=g.ch; o.title=g.name;
      if(g.ch===gl) o.selected=true;
      sel.appendChild(o);
    });
    const nameI=document.createElement('input');
    nameI.type='text'; nameI.placeholder='지표 이름'; nameI.value=name;
    const rangeI=document.createElement('input');
    rangeI.type='range'; rangeI.min=0; rangeI.max=100; rangeI.step=5; rangeI.value=val;
    const del=document.createElement('button');
    del.className='del'; del.title='삭제'; del.textContent='×';
    del.addEventListener('click',()=>{ row.remove(); renderRel(); save(); });
    [sel,nameI,rangeI].forEach(el=>el.addEventListener('input',()=>{ renderRel(); save(); }));
    row.append(sel,nameI,rangeI,del);
    gaugeRows.appendChild(row);
  }
  $('addGauge').addEventListener('click',()=>addGaugeRow());
  function gaugeData(){
    return [...gaugeRows.children].map(r=>{
      const sel=r.querySelector('select');
      const [t,g]=r.querySelectorAll('input');
      return {name:t.value.trim(), val:+g.value, glyph:sel.value};
    }).filter(g=>g.name);
  }

  /* ══ 사진 슬롯 ══ */
  let photoCount=0;
  const photos=[
    {data:null, zoom:100, x:50, y:50},
    {data:null, zoom:100, x:50, y:50},
  ];
  const photoct=$('photoct');
  [...photoct.children].forEach(b=>{
    b.addEventListener('click',()=>{
      photoCount=+b.dataset.n;
      [...photoct.children].forEach(c=>c.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      $('pe0').classList.toggle('hidden', photoCount<1);
      $('pe1').classList.toggle('hidden', photoCount<2);
      renderPhotos(); save();
    });
  });

  /* 업로드: 캔버스로 축소해서 저장 (localStorage 용량 보호) */
  function loadPhoto(slot, file){
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=900;
        const sc=Math.min(1, MAX/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        photos[slot].data=cv.toDataURL('image/jpeg',0.88);
        photos[slot].zoom=100; photos[slot].x=50; photos[slot].y=50;
        $('pz'+slot).value=100;
        renderPhotos(); save();
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  }
  [0,1].forEach(i=>{
    $('pu'+i).addEventListener('click',()=>$('pf'+i).click());
    $('pf'+i).addEventListener('change',e=>{
      const f=e.target.files[0]; if(f) loadPhoto(i,f); e.target.value='';
    });
    $('px'+i).addEventListener('click',()=>{
      photos[i].data=null; renderPhotos(); save();
    });
    $('pz'+i).addEventListener('input',e=>{
      photos[i].zoom=+e.target.value; renderPhotos(); save();
    });
  });

  function renderPhotos(){
    $('vPhotos').classList.toggle('hidden', photoCount===0);
    $('fr1').classList.toggle('hidden', photoCount<2);
    [0,1].forEach(i=>{
      const fr=$('fr'+i), p=photos[i];
      if(p.data){
        fr.textContent='';
        fr.style.backgroundImage='url('+p.data+')';
        fr.style.backgroundSize=p.zoom+'%';
        fr.style.backgroundPosition=p.x+'% '+p.y+'%';
      }else{
        fr.style.backgroundImage='';
        fr.textContent='사진 '+(i+1);
      }
    });
  }

  /* 드래그로 위치 옮기기 */
  [0,1].forEach(i=>{
    const fr=$('fr'+i);
    let drag=null;
    fr.addEventListener('pointerdown',e=>{
      if(!photos[i].data) return;
      drag={sx:e.clientX, sy:e.clientY, ox:photos[i].x, oy:photos[i].y};
      fr.setPointerCapture(e.pointerId);
    });
    fr.addEventListener('pointermove',e=>{
      if(!drag) return;
      const rect=fr.getBoundingClientRect();
      photos[i].x=Math.max(0,Math.min(100, drag.ox - (e.clientX-drag.sx)/rect.width*100));
      photos[i].y=Math.max(0,Math.min(100, drag.oy - (e.clientY-drag.sy)/rect.height*100));
      renderPhotos();
    });
    fr.addEventListener('pointerup',()=>{ drag=null; save(); });
    fr.addEventListener('pointercancel',()=>{ drag=null; });
  });

  /* ══ 관계 시트 렌더 ══ */
  function renderRel(){
    $('vA').textContent=$('rA').value||'A';
    $('vB').textContent=$('rB').value||'B';
    const w=$('rWord').value.trim();
    $('vWord').textContent=w?('— '+w+' —'):''; $('vWord').style.display=w?'':'none';
    $('vGauges').innerHTML = gaugeData().map(g=>{
      const track=(g.glyph+' ').repeat(10).trim();
      return '<div class="g"><div class="gname">'+esc(g.name)+'</div>'+
        '<div class="track">'+track+
          '<div class="fill" style="width:'+g.val+'%">'+track+'</div>'+
        '</div>'+
        '<div class="gnum">'+g.val+'</div></div>';
    }).join('');
    const tags=$('rTags').value.split(',').map(t=>t.trim()).filter(Boolean);
    $('vRTags').innerHTML=tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
    $('vRTags').style.display=tags.length?'':'none';
    const memo=$('rMemo').value.trim();
    $('vMemo').textContent=memo; $('vMemo').style.display=memo?'':'none';
    const foot=$('rFoot').value.trim();
    $('vRFoot').textContent=foot; $('vRFoot').style.display=foot?'':'none';
  }
  ['rA','rB','rWord','rTags','rMemo','rFoot'].forEach(id=>
    $(id).addEventListener('input',()=>{ renderRel(); save(); }));

  /* ══ 저장/복원 ══ */
  const KEY='myeongham.v3';
  function state(){
    return {
      mode, photoCount,
      hex:HEX.map(h=>$(h.inp).value),
      biz:Object.fromEntries(['bCo','bDept','bName','bTitle','bTel','bMail','bAddr','bWeb'].map(id=>[id,$(id).value])),
      rel:Object.fromEntries(['rA','rB','rWord','rTags','rMemo','rFoot'].map(id=>[id,$(id).value])),
      gauges:gaugeData(),
      photos:photos.map(p=>({...p})),
    };
  }
  function apply(s){
    if(!s) return;
    if(s.hex) HEX.forEach((h,i)=>{ if(s.hex[i]) $(h.inp).value=s.hex[i]; });
    applyHex();
    if(s.biz) Object.entries(s.biz).forEach(([k,v])=>{ if($(k)) $(k).value=v; });
    if(s.rel) Object.entries(s.rel).forEach(([k,v])=>{ if($(k)) $(k).value=v; });
    gaugeRows.innerHTML='';
    (s.gauges&&s.gauges.length? s.gauges : DEFAULT_GAUGES).forEach(g=>addGaugeRow(g.name, g.val, g.glyph||GLYPHS[0].ch));
    if(s.photos) s.photos.forEach((p,i)=>{ photos[i]={...photos[i],...p}; $('pz'+i).value=photos[i].zoom; });
    photoCount=s.photoCount||0;
    [...photoct.children].forEach(c=>c.setAttribute('aria-pressed', String(+c.dataset.n===photoCount)));
    $('pe0').classList.toggle('hidden', photoCount<1);
    $('pe1').classList.toggle('hidden', photoCount<2);
    renderCard(); renderRel(); renderPhotos(); setMode(s.mode||'card');
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state())); }catch(e){} }
  function restore(){ try{ apply(JSON.parse(localStorage.getItem(KEY)||'null')); }catch(e){} }

  $('jsonSave').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(state(),null,2)],{type:'application/json'});
    const a=document.createElement('a');
    const nm = mode==='card' ? ($('bName').value||'명함') : (($('rA').value||'A')+'_'+($('rB').value||'B'));
    a.href=URL.createObjectURL(blob); a.download='기록_'+nm+'.json';
    a.click(); URL.revokeObjectURL(a.href); flash('기록을 저장했습니다');
  });
  $('jsonLoad').addEventListener('click',()=>$('jsonFile').click());
  $('jsonFile').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ apply(JSON.parse(r.result)); save(); flash('기록을 불러왔습니다'); }catch(err){ flash('파일을 읽지 못했습니다'); } };
    r.readAsText(f); e.target.value='';
  });

  $('pngBtn').addEventListener('click',()=>{
    if(typeof html2canvas!=='function'){ flash('이미지 기능을 불러오지 못했습니다'); return; }
    const el = mode==='card' ? $('cardView') : $('relView');
    flash('찍는 중…');
    html2canvas(el,{scale:2,backgroundColor:null}).then(cv=>{
      const a=document.createElement('a');
      a.href=cv.toDataURL('image/png');
      a.download = (mode==='card'?($('bName').value||'명함'):'관계시트')+'.png';
      a.click();
    }).catch(()=>flash('이미지 저장에 실패했습니다'));
  });

  /* 초기화 */
  DEFAULT_GAUGES.forEach(g=>addGaugeRow(g.name, g.val, g.glyph));
  applyHex(); renderCard(); renderRel(); renderPhotos(); restore();
})();
</script>
</body>
</html>
